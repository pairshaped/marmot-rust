[package]
name = "marmot"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
heck = "0.5"
rusqlite = { version = "0.37", features = ["bundled", "column_metadata"] }
thiserror = "2"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
